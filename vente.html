<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BME_TECH - Ventes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="vente.css">
    <link rel="stylesheet" href="light-mode.css">
</head>
<body>
    
    <!-- Bouton Menu Mobile (Hamburger) -->
    <button id="mobile-menu-btn" class="mobile-menu-btn">
        <i class="fa-solid fa-bars"></i>
    </button>

    <!-- Fond semi-transparent -->
    <div id="mobile-overlay" class="mobile-overlay"></div>

    <!-- BARRE LATÉRALE (SIDEBAR) -->
    <aside class="sidebar" id="sidebar">
        <!-- Bouton Fermer (Croix) pour mobile -->
        <button id="close-menu-btn" class="close-menu-btn">
            <i class="fa-solid fa-xmark"></i>
        </button>

        <div class="sidebar-header">
            <img src="img3.png" alt="Logo BME" class="sidebar-logo">
            <div class="sidebar-text">
                <h2>BME Technologie</h2>
                <p>PERFORMANCE ET RAPIDITÉ</p>
            </div>
        </div>

        <ul class="menu">
            <li><a href="dash.html"><i class="fa-solid fa-border-all"></i> TABLEAU DE BORD</a></li>
            <li><a href="repar.html"><i class="fa-solid fa-screwdriver-wrench"></i> RÉPARATION</a></li>
            <li><a href="equip.html"><i class="fa-solid fa-bolt"></i> ÉQUIPEMENTS</a></li>
            <li class="active"><a href="vente.html"><i class="fa-solid fa-cash-register"></i> VENTES</a></li>
        </ul>

        <div class="sidebar-footer">
            <a href="para.html"><i class="fa-solid fa-gear"></i> PARAMÈTRES</a>
        </div>
    </aside>

    <!-- CONTENU PRINCIPAL -->
    <main class="contenu">
        <header class="main-header">
            <h2><i class="fa-solid fa-cash-register"></i> BME Technologie - Gestion</h2>
            <h4>Enregistrement des Ventes</h4>
        </header>

        <!-- FORMULAIRE DE VENTE -->
        <section class="form-section">
            <form id="formProduit">
                <div class="form-card">
                    <div class="form-group">
                        <label for="nomClient">Nom client</label>
                        <input type="text" id="nomClient" required placeholder="Nom du client">
                    </div>

                    <div class="form-group">
                        <label for="telephone">Téléphone</label>
                        <input type="text" id="telephone" required placeholder="Numéro de téléphone">
                    </div>

                    <div class="form-group">
                        <label for="equipement">Équipement</label>
                        <input type="text" id="equipement" placeholder="Nom de l'équipement">
                    </div>

                    <div class="form-group">
                        <label for="reference">Référence</label>
                        <input type="text" id="reference" placeholder="Réf. équipement">
                    </div>

                    <div class="form-group">
                        <label for="quantite">Quantité</label>
                        <input type="number" id="quantite" min="1" value="1">
                    </div>

                    <div class="form-group">
                        <label for="prix">Prix de Vente (FCFA)</label>
                        <input type="number" id="prix" min="0" placeholder="Ex: 15000">
                    </div>

                    <div class="form-group">
                        <label for="date">Date Vente</label>
                        <input type="date" id="date" required>
                    </div>
                </div>

                <!-- ZONE LISTE DES ÉQUIPEMENTS AJOUTÉS POUR CE CLIENT -->
                <div id="zoneEquipementsAjoutes" style="display: none; background: #0d1117; padding: 12px; border-radius: 6px; border: 1px solid #30363d; margin-bottom: 15px; margin-top: 15px;">
                    <label style="font-size: 0.8rem; color: #58a6ff; font-weight: bold;">Équipements enregistrés pour la vente en cours :</label>
                    <ul id="listeEquipements" style="list-style: none; padding-left: 0; margin-top: 8px; font-size: 0.85rem; color: #f0f6fc;">
                        <!-- Injection JS -->
                    </ul>
                </div>

                <div class="btn-group-right">
                    <button type="button" class="btn btn-ajouter" id="btnAjouterEquipement">
                        <i class="fa-solid fa-plus"></i> AJOUTER L'ÉQUIPEMENT
                    </button>

                    <button type="button" id="btnFacture" class="btn btn-invoice">
                        <i class="fa-solid fa-file-invoice"></i> FACTURE
                    </button>

                    <button type="submit" class="btn btn-save">
                        <i class="fa-solid fa-floppy-disk"></i> VALIDER VENTE
                    </button>
                </div>
            </form>
        </section>

        <!-- TABLEAU HISTORIQUE DES VENTES -->
        <section class="table-section">
            <div class="table-header-flex">
                <h2><i class="fa-solid fa-receipt"></i> Historique des ventes</h2>
                
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="search" id="searchVente" placeholder="Rechercher une vente...">
                </div>
            </div>

            <div class="table-card">
                <div class="table-container">
                    <table id="tableVente" class="data-table">
                        <thead>
                            <tr>
                                <th>Nom client</th>
                                <th>Téléphone</th>
                                <th>Équipement(s)</th>
                                <th>Référence(s)</th>
                                <th class="text-center">Qté Totale</th>
                                <th>Prix vente (FCFA)</th>
                                <th>Date</th>
                                <th class="text-center" style="width: 100px;">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="tbodyVente">
                            <!-- Injection dynamique JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
        <div id="toast-container" class="toast-container"></div>
    </main>

    <script src="vente.js"></script>
</body>
</html>
