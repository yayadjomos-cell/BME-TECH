<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BME_TECH - Connexion</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="light-mode.css">
   <link rel="stylesheet" href="formu.css">
</head>
<body>

    <div class="login-container">
        <img src="img3.png" alt="Logo BME" class="login-logo">
        <h2>BME Technologie</h2>
        <p>Veuillez vous connecter pour continuer</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Nom d'utilisateur</label>
                <input type="text" id="username" required placeholder="Entrez votre identifiant">
            </div>
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" required placeholder="Entrez votre mot de passe">
            </div>
            <button type="submit" class="btn-login">
                <i class="fa-solid fa-right-to-bracket"></i> SE CONNECTER
            </button>
            <div id="errorMsg" class="error-msg">Identifiant ou mot de passe incorrect.</div>
        </form>
    </div>

    <script src="formu.js"></script>
</body>
</html>
